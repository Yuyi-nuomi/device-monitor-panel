<h2>技术原理</h2>
<p style="margin-top:10px;">PCT_100 采用 Arduino 主控 + WiFi 物联网架构，通过 MQTT 协议与云端通信，实现工业化工过程控制模拟。</p>

<h3 style="margin:20px 0 10px;">控制流程</h3>
<p>按键输入 → 逻辑处理 → 继电器输出 → LED 状态指示 → MQTT 上传数据</p>

<h3 style="margin:20px 0 10px;">通讯架构</h3>
<p>WiFi → MQTT 服务器 → 远程监控平台</p>
